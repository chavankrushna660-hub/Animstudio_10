<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52D2D" />
      <stop offset="40%" stop-color="#D32424" />
      <stop offset="80%" stop-color="#B81414" />
      <stop offset="100%" stop-color="#9E0C0C" />
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0.2" />
    </radialGradient>
    <filter id="shadowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#400000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#250000" flood-opacity="0.7" />
    </filter>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#FAFBFD" />
      <stop offset="100%" stop-color="#EFF1F5" />
    </linearGradient>
    <linearGradient id="bevelStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#DDA0A0" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle for rich app icon look -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="100" fill="url(#topGlow)" />
  <rect x="4" y="4" width="504" height="504" rx="96" fill="none" stroke="#FFA3A3" stroke-width="2" stroke-opacity="0.35" />

  <!-- Letter A with exact contours matching user logo -->
  <g filter="url(#shadowA)">
    <path
      fill="url(#letterGrad)"
      stroke="url(#bevelStroke)"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
      fill-rule="evenodd"
      d="
        M 194 86
        C 198 76, 210 70, 226 70
        L 286 70
        C 302 70, 314 76, 318 86
        L 426 388
        C 434 408, 420 424, 396 424
        L 332 424
        C 316 424, 304 412, 298 396
        L 278 340
        C 268 346, 244 346, 234 340
        L 214 396
        C 208 412, 196 424, 180 424
        L 116 424
        C 92 424, 78 408, 86 388
        L 194 86 Z

        M 236 284
        L 276 284
        C 278 272, 262 148, 256 138
        C 250 148, 234 272, 236 284 Z
      "
    />
  </g>
</svg>