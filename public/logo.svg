<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Google-optimized vibrant red gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF233C" />
      <stop offset="35%" stop-color="#E01A36" />
      <stop offset="70%" stop-color="#D90429" />
      <stop offset="100%" stop-color="#B8001F" />
    </linearGradient>

    <!-- Subtle surface glow -->
    <radialGradient id="topGlow" cx="50%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#FF5977" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8D0801" stop-opacity="0.1" />
    </radialGradient>

    <!-- Soft drop shadow for embossed 3D letter effect -->
    <filter id="shadowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A000E" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#300008" flood-opacity="0.8" />
    </filter>

    <!-- White embossed letter gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#FBFBFC" />
      <stop offset="100%" stop-color="#F0F1F5" />
    </linearGradient>

    <!-- Beveled highlight border for 3D depth -->
    <linearGradient id="bevelStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E8A5AF" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Google-compliant 1:1 square canvas background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <rect width="512" height="512" fill="url(#topGlow)" />

  <!-- Iconic Embossed White Letter "A" matching exact brand shape -->
  <g filter="url(#shadowA)">
    <path
      fill="url(#letterGrad)"
      stroke="url(#bevelStroke)"
      stroke-width="3.5"
      stroke-linejoin="round"
      stroke-linecap="round"
      fill-rule="evenodd"
      d="
        M 192 108
        C 220 118, 292 118, 320 108
        C 334 116, 342 134, 348 152
        L 426 384
        C 434 406, 420 422, 396 422
        L 336 422
        C 318 422, 306 410, 300 392
        L 282 338
        C 272 344, 240 344, 230 338
        L 212 392
        C 206 410, 194 422, 176 422
        L 116 422
        C 92 422, 78 406, 86 384
        L 164 152
        C 170 134, 178 116, 192 108 Z

        M 234 282
        L 278 282
        C 280 270, 264 176, 256 162
        C 248 176, 232 270, 234 282 Z
      "
    />
  </g>
</svg>
